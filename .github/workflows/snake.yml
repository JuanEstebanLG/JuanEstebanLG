# Guardar en: .github/workflows/snake.yml
# Genera la serpiente de contribuciones en la rama "output"
name: Snake

on:
  schedule:
    - cron: "23 5 * * *"   # todos los días
  workflow_dispatch:        # ejecución manual desde la pestaña Actions
  push:
    branches: ["main", "master"]
    paths: [".github/workflows/snake.yml"]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#4C1D95,#6D28D9,#8B5CF6,#C4B5FD
            dist/snake-light.svg?palette=github-light&color_snake=#0891B2&color_dots=#EBEDF0,#DDD6FE,#A78BFA,#7C3AED,#4C1D95

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
