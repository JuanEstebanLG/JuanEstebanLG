# Guardar en: .github/workflows/metrics.yml
# Genera github-metrics.svg en la raíz del repo JuanEstebanLG/JuanEstebanLG
name: Metrics

on:
  schedule:
    - cron: "17 5 * * *"   # todos los días
  workflow_dispatch:        # ejecución manual desde la pestaña Actions
  push:
    branches: ["main", "master"]
    paths: [".github/workflows/metrics.yml"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          config_timezone: America/Bogota

          # Tarjeta base: cabecera, actividad, comunidad y repositorios
          base: header, activity, community, repositories

          # Calendario isométrico con rachas y promedio de commits
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Lenguajes más usados
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
